<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1222">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SAHOVERSE">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SAHOVERSE - 2人で遊べるオリジナルカードゲーム。">
  <link rel="manifest" href="./manifest.webmanifest?v=80">
  <link rel="apple-touch-icon" sizes="180x180" href="./sahoverse-icon-180.png?v=80">
  <link rel="icon" href="./sahoverse-icon-192.png?v=80" type="image/png">
  <link rel="stylesheet" href="./style.css?v=80">
  <title>SAHOVERSE｜カードバトル</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img src="./sahoverse-icon-180.png?v=80" alt="" class="brand-logo"><span>SAHO<b>VERSE</b></span></div>
    <span id="network" class="network">読み込み中</span>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fx-overlay" class="fx-overlay" aria-hidden="true"></div>
</div>
<script>
// This script runs even when ES modules or Firebase configuration fail.
(function(){
  window.__DUEL_READY=false;
  var failed=false, failureMessage='';
  function showProblem(message){
    if(window.__DUEL_READY || failed)return;
    failed=true;
    var view=document.getElementById('view');
    var network=document.getElementById('network');
    if(network){network.textContent='起動エラー';network.className='network off';}
    if(!view)return;
    view.replaceChildren();
    var section=document.createElement('section');section.className='panel';
    section.style.margin='16px';
    var h=document.createElement('h2');h.textContent='ゲームを起動できませんでした';
    var p=document.createElement('p');p.className='small';
    p.textContent='一部のJavaScriptファイル、または端末の保存領域に問題がある可能性があります。ゲームの容量が原因とは限りません。';
    var detail=document.createElement('p');detail.className='small muted';
    detail.style.overflowWrap='anywhere';
    detail.textContent='診断：'+String(message||failureMessage||'読み込みが完了していません').slice(0,500);
    var reload=document.createElement('button');reload.className='btn primary wide';reload.textContent='もう一度開く';
    reload.addEventListener('click',function(){location.reload();});
    var reset=document.createElement('button');reset.className='btn ghost wide mt8';reset.textContent='ゲームの端末保存データを初期化して再試行';
    reset.addEventListener('click',function(){
      if(!confirm('この端末に保存されたSAHOVERSEのデッキ・カード・パック・設定が消えます。Firebaseの共有データは消えません。実行しますか？'))return;
      try{var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('duel-'))keys.push(k);}
        keys.forEach(function(k){localStorage.removeItem(k);});}catch(e){}
      location.reload();
    });
    section.append(h,p,detail,reload,reset);view.append(section);
  }
  window.DUEL_BOOT_FAILURE=showProblem;
  window.addEventListener('error',function(e){
    if(!window.__DUEL_READY && e.error){failureMessage=e.error.message||String(e.error);showProblem(failureMessage);}
  });
  window.addEventListener('unhandledrejection',function(e){
    if(!window.__DUEL_READY){failureMessage=e.reason?.message||String(e.reason);showProblem(failureMessage);}
  });
  window.addEventListener('DOMContentLoaded',function(){
    var view=document.getElementById('view');
    if(view && !view.hasChildNodes()){
      var p=document.createElement('p');p.className='small muted';p.style.padding='16px';
      p.textContent='準備中…';view.append(p);
    }
    setTimeout(function(){if(!window.__DUEL_READY)showProblem(failureMessage||'8秒以内に起動処理が完了しませんでした');},8000);
  });
})();
</script>
<script type="module">
// Unlike a static import, a failed dependency is caught and shown on the page.
import('./app.js?v=80').catch(error=>window.DUEL_BOOT_FAILURE(error?.message||String(error)));
</script>
</body>
</html>
