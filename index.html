<script>
'use strict';
(function(){
const KEY='doctorpay_local_v1';
const svg={home:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg>',calendar:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',wallet:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="16" rx="2"/><path d="M17 14h5M2 9h20"/><circle cx="17" cy="14" r=".8" fill="currentColor"/></svg>',chart:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"><path d="M4 21V3M4 21h17M9 17v-5M14 17V7M19 17v-9"/></svg>',settings:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l.7 2.4 2 1.2 2.4-.6 2 3.5-1.7 1.8v2.4l1.7 1.8-2 3.5-2.4-.6-2 1.2L14 21h-4l-.7-2.4-2-1.2-2.4.6-2-3.5 1.7-1.8v-2.4L3 8.5 5 5l2.4.6 2-1.2z"/></svg>'};
const pages=[['home','ホーム'],['calendar','カレンダー'],['payments','給与振込'],['analytics','集計・分析'],['settings','設定']];
const TODAY=localISO(new Date());
let state={tab:'home',month:TODAY.slice(0,7),year:Number(TODAY.slice(0,4)),day:null,employerScope:'year'};
let data=load();
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthOffset(s,n){const [y,m]=s.split('-').map(Number); const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthTitle(s){const [y,m]=s.split('-').map(Number);return y+'年'+m+'月'}
function money(n){return new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0))+'円'}
function shortMoney(n){n=Number(n)||0;return n>=100000 ? (n/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万' : new Intl.NumberFormat('ja-JP').format(n)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function validMonth(s){return typeof s==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(s)}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return !isNaN(d)&&localISO(d)===s}
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
function num(v){let n=Number(v);return Number.isFinite(n)?Math.max(0,Math.round(n)):0}
function normalize(v){if(!v||v.version!==1||!Array.isArray(v.shifts)||!Array.isArray(v.employers)||!Array.isArray(v.settlements))throw Error('対応していないバックアップ形式です');const employers=v.employers.filter(x=>x&&x.id&&x.name).map(x=>({id:String(x.id),name:String(x.name).slice(0,100)}));const ids=new Set(employers.map(x=>x.id));const shifts=v.shifts.filter(x=>x&&validDate(x.date)&&ids.has(String(x.employerId))).map(x=>({id:String(x.id||uid()),date:x.date,employerId:String(x.employerId),base:num(x.base),travel:num(x.travel),memo:String(x.memo||'').slice(0,1000)}));const settlements=v.settlements.filter(x=>x&&validMonth(x.workMonth)&&validDate(x.depositDate)&&(x.employerId==='all'||ids.has(String(x.employerId)))).map(x=>({id:String(x.id||uid()),workMonth:x.workMonth,depositDate:x.depositDate,employerId:String(x.employerId),tax:num(x.tax),net:num(x.net),memo:String(x.memo||'').slice(0,1000)}));return{version:1,employers,shifts,settlements,updatedAt:typeof v.updatedAt==='string'?v.updatedAt:null}}
function load(){try{const txt=localStorage.getItem(KEY);if(txt)return normalize(JSON.parse(txt))}catch(e){console.error('データ読み込み失敗:',e);setTimeout(()=>toast('保存データを読み込めません。設定からバックアップを確認してください。'),0)}return{version:1,employers:[],shifts:[],settlements:[],updatedAt:null}}
function save(){try{data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));render();return true}catch(e){alert('端末への保存に失敗しました。ブラウザの空き容量・プライベートモードを確認してください。');return false}}
function employerName(id){return id==='all'?'全勤務先まとめて':(data.employers.find(e=>e.id===id)||{}).name||'不明な勤務先'}
function monthShifts(m){return data.shifts.filter(x=>x.date.slice(0,7)===m).sort((a,b)=>a.date.localeCompare(b.date)||employerName(a.employerId).localeCompare(employerName(b.employerId),'ja'))}
function monthSettlements(m){return data.settlements.filter(x=>x.workMonth===m).sort((a,b)=>a.depositDate.localeCompare(b.depositDate))}
function deposits(m){return data.settlements.filter(x=>x.depositDate.slice(0,7)===m).sort((a,b)=>a.depositDate.localeCompare(b.depositDate))}
function aggregate(shifts,settlements){return{base:shifts.reduce((a,x)=>a+x.base,0),travel:shifts.reduce((a,x)=>a+x.travel,0),gross:shifts.reduce((a,x)=>a+x.base+x.travel,0),tax:settlements.reduce((a,x)=>a+x.tax,0),net:settlements.reduce((a,x)=>a+x.net,0),hasPayment:settlements.length>0}}
function kpi(title,value,sub,color){return `<div class="card kpi"><div class="title"><i class="dot ${color||''}"></i>${title}</div><div class="value">${value}</div><div class="detail">${sub}</div></div>`}
function nav(){return pages.map(([id,name])=>`<button class="side-link ${state.tab===id?'active':''}" data-action="nav" data-tab="${id}" aria-current="${state.tab===id?'page':'false'}">${svg[id==='payments'?'wallet':id==='analytics'?'chart':id]}<span>${name}</span></button>`).join('')}
function mobileNav(){return pages.map(([id,name])=>`<button data-action="nav" data-tab="${id}" class="${state.tab===id?'active':''}" aria-label="${name}">${svg[id==='payments'?'wallet':id==='analytics'?'chart':id]}<span>${name}</span></button>`).join('')}
function monthControl(){return `<div class="month-controls"><button class="button icon" data-action="prev-month" aria-label="前月">‹</button><label class="month-picker-wrap"><span class="month-display">${monthTitle(state.month)} ▾</span><input class="month-picker" type="month" id="month-picker" value="${state.month}" aria-label="対象月"></label><button class="button icon" data-action="next-month" aria-label="翌月">›</button></div>`}
function yearControl(){return `<div class="month-controls"><button class="button icon" data-action="prev-year" aria-label="前年">‹</button><strong style="font-size:17px;padding:0 8px">${state.year}年</strong><button class="button icon" data-action="next-year" aria-label="翌年">›</button></div>`}
function header(title,subtitle,showMonth=true){return `<div class="topbar"><div><div class="eyebrow">DOCTOR PAY</div><h1>${title}</h1><div class="month-sub">${subtitle}</div></div><div class="top-actions">${showMonth?monthControl():''}<button class="button primary" data-action="add-shift">＋ 勤務を登録</button></div></div>`}
function shiftLine(x){const dt=new Date(x.date+'T12:00:00');const md=(dt.getMonth()+1)+'/'+dt.getDate();return `<div class="rowline"><div class="lead"><div class="date-badge">${md}<div class="muted">${'日月火水木金土'[dt.getDay()]}</div></div><div style="min-width:0"><div class="names">${esc(employerName(x.employerId))}</div><div class="sub">交通費なし ${money(x.base)}${x.memo?' ・ '+esc(x.memo):''}</div></div></div><div><div class="money">${money(x.base+x.travel)}</div><div class="actions"><button class="text-button" data-action="edit-shift" data-id="${esc(x.id)}">編集</button></div></div></div>`}
function settlementLine(x){return `<div class="rowline"><div class="lead"><div class="date-badge">${esc(x.depositDate.slice(5).replace('-','/'))}</div><div style="min-width:0"><div class="names">${esc(employerName(x.employerId))}</div><div class="sub">${esc(monthTitle(x.workMonth))}勤務分 ・ 所得税 ${money(x.tax)}${x.memo?' ・ '+esc(x.memo):''}</div></div></div><div><div class="money">${money(x.net)}</div><div class="actions"><button class="text-button" data-action="edit-payment" data-id="${esc(x.id)}">編集</button></div></div></div>`}
function empty(title,sub,action,text){return `<div class="empty"><div class="big">▤</div><b>${title}</b><div>${sub}</div>${action?`<button class="button sm primary" data-action="${action}">${text||'登録する'}</button>`:''}</div>`}
function home(){const s=monthShifts(state.month),p=monthSettlements(state.month),a=aggregate(s,p),d=deposits(state.month),received=d.reduce((n,x)=>n+x.net,0);const title=monthTitle(state.month);return header('給与ダッシュボード','単発勤務の収入をひと目で確認')+`<div class="hero"><div><h2>${title}の勤務実績</h2><p>勤務日の記録から、交通費込みの額面を自動集計します。<br>所得税・手取りは振込後に追加できます。</p></div><div><div class="hero-label">交通費込みの額面</div><div class="hero-number">${money(a.gross)}</div></div></div><div class="kpi-grid">${kpi('交通費込み額面',money(a.gross),s.length+'件の勤務記録')}${kpi('交通費抜き額面',money(a.base),'交通費 '+money(a.travel),'blue')}${kpi('所得税',a.hasPayment?money(a.tax):'—',a.hasPayment?'振込情報 '+p.length+'件':'振込後に入力','amber')}${kpi('手取り',a.hasPayment?money(a.net):'—',a.hasPayment?'勤務月に紐づく振込':'振込後に入力','pink')}</div><div class="section-grid" style="margin-top:19px"><section class="card"><div class="card-heading"><h2>勤務の一覧 <span class="pill gray">${s.length}件</span></h2><button class="button sm" data-action="nav" data-tab="calendar">カレンダーを見る</button></div>${s.length?s.slice(0,6).map(shiftLine).join('')+ (s.length>6?`<button class="button ghost" data-action="nav" data-tab="calendar">他 ${s.length-6}件を表示</button>`:''):empty('この月の勤務登録はありません','カレンダーから日付ごとに登録できます。','add-shift','勤務を登録')}</section><section class="card"><div class="card-heading"><h2>給与振込の記録</h2><button class="button sm" data-action="add-payment">＋ 振込を登録</button></div><div class="split-summaries" style="margin-bottom:14px"><div class="small-stat"><span>この勤務月に紐づく手取り</span><strong>${p.length?money(a.net):'—'}</strong></div><div class="small-stat"><span>今月実際に振り込まれた手取り</span><strong>${d.length?money(received):'—'}</strong></div></div>${p.length?p.slice(0,4).map(settlementLine).join(''):empty('振込情報はまだありません','所得税と手取りは後から月単位で登録できます。','add-payment','振込を登録')}</section></div><div class="info-box" style="margin-top:16px"><strong>勤務月と振込月は別々に管理します</strong>上の額面は「${title}に働いた分」、振込の手取りは「実際に口座へ入った月」で確認できます。未入力の手取りは0円ではなく「—」と表示します。</div>${footer()}`}
function calendar(){const [year,month]=state.month.split('-').map(Number);const first=new Date(year,month-1,1).getDay(),last=new Date(year,month,0).getDate();const totalCells=Math.ceil((first+last)/7)*7;let cells='';const ss=monthShifts(state.month);for(let i=0;i<totalCells;i++){const day=i-first+1,valid=day>0&&day<=last;let date,items=[];if(valid){date=state.month+'-'+String(day).padStart(2,'0');items=ss.filter(x=>x.date===date)}let gross=items.reduce((n,x)=>n+x.base+x.travel,0);cells+=`<button class="day ${valid?'':'other'} ${date===TODAY?'today':''}" ${valid?`data-action="open-day" data-date="${date}" aria-label="${day}日、${items.length}件、額面${money(gross)}"`:'disabled aria-hidden="true"'}><span class="day-num">${valid?day:''}</span>${items.length?`<span class="day-total">${shortMoney(gross)}</span>${items.slice(0,2).map(x=>`<span class="day-company">${esc(employerName(x.employerId))}</span>`).join('')}${items.length>2?`<span class="day-add">他${items.length-2}件</span>`:''}`:valid?'<span class="day-add">＋</span>':''}</button>`}return header('勤務カレンダー','日付をタップして勤務を登録・編集')+`<div class="card calendar-card calendar-wrap"><div class="card-heading" style="padding:2px 6px 0"><h2>${monthTitle(state.month)}</h2><span class="calendar-legend">金額は交通費込みの額面</span></div><div class="weekday-grid">${['日','月','火','水','木','金','土'].map(x=>`<div class="weekday">${x}</div>`).join('')}</div><div class="calendar-grid">${cells}</div></div><div class="section-header"><h2>この月の勤務 <span class="pill gray">${ss.length}件</span></h2><button class="button sm primary" data-action="add-shift">＋ 勤務を追加</button></div><div class="card">${ss.length?ss.map(shiftLine).join(''):empty('勤務の登録がありません','カレンダーの日付をタップしてください。')}</div>${footer()}`}
function payments(){const p=monthSettlements(state.month),d=deposits(state.month),s=monthShifts(state.month),a=aggregate(s,p),actual=d.reduce((n,x)=>n+x.net,0);return header('給与振込','所得税と実際の手取りを後から記録')+`<div class="info-box"><strong>勤務情報は先に、振込情報は後から</strong>振込を登録するときは「何月の勤務分か」と「実際の振込日」を指定します。同じ勤務先で複数日働いた分は、まとめて1件の振込として登録できます。各振込額は給与明細・通帳の金額を入力してください。</div><div class="kpi-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px">${kpi(monthTitle(state.month)+'勤務分の所得税',p.length?money(a.tax):'—','勤務月ベース','amber')}${kpi(monthTitle(state.month)+'に入金された手取り',d.length?money(actual):'—','振込日ベース','pink')}</div><div class="section-header"><h2>${monthTitle(state.month)}勤務分の振込記録</h2><button class="button primary sm" data-action="add-payment">＋ 振込を登録</button></div><div class="card">${p.length?p.map(settlementLine).join(''):empty('この勤務月の振込情報はありません','給与が振り込まれた後から入力できます。','add-payment','振込を登録')}</div><div class="section-header"><h2>${monthTitle(state.month)}の入金実績</h2><span class="pill gray">振込日ベース</span></div><div class="card">${d.length?d.map(settlementLine).join(''):empty('この月の入金記録はありません','他の勤務月分の振込もここに表示されます。')}</div><p class="detail-note">※ 振込済みかどうかの管理ではなく、実際の金額を記録するための画面です。手取りと額面の差額には所得税以外の控除等が含まれる場合があります。</p>${footer()}`}
function analytics(){const months=Array.from({length:12},(_,i)=>state.year+'-'+String(i+1).padStart(2,'0'));const records=data.shifts.filter(x=>x.date.startsWith(String(state.year)+'-'));const pays=data.settlements.filter(x=>x.workMonth.startsWith(String(state.year)+'-'));const agg=aggregate(records,pays);const per=months.map(m=>aggregate(monthShifts(m),monthSettlements(m)));const max=Math.max(1,...per.map(x=>x.gross));const bars=per.map((x,i)=>`<div class="bar-col"><div class="bar-inner"><div class="bar" style="height:${x.gross?Math.max(2,100*x.gross/max):0}%" title="${i+1}月 額面 ${money(x.gross)}"></div><div class="bar net" style="height:${x.hasPayment?Math.max(2,100*x.net/max):0}%" title="${i+1}月 手取り ${x.hasPayment?money(x.net):'未入力'}"></div></div><span class="bar-label">${i+1}月</span></div>`).join('');const annualDeposit=data.settlements.filter(x=>x.depositDate.startsWith(String(state.year)+'-')).reduce((n,x)=>n+x.net,0);const byCompany=data.employers.map(e=>{const sr=records.filter(x=>x.employerId===e.id),pr=pays.filter(x=>x.employerId===e.id);return{company:e.name,a:aggregate(sr,pr),count:sr.length}}).filter(x=>x.count>0||x.a.hasPayment).sort((a,b)=>b.a.gross-a.a.gross);const unassigned=pays.filter(x=>x.employerId==='all');if(unassigned.length)byCompany.push({company:'全勤務先まとめて（振込のみ）',a:aggregate([],unassigned),count:0});return `<div class="topbar"><div><div class="eyebrow">DOCTOR PAY</div><h1>集計・分析</h1><div class="month-sub">年間の収入と勤務先別の内訳</div></div><div class="top-actions">${yearControl()}<button class="button" data-action="export-shifts">CSV出力</button></div></div><div class="kpi-grid">${kpi('年間額面（交通費込）',money(agg.gross),records.length+'件の勤務')}${kpi('年間額面（交通費抜）',money(agg.base),'交通費 '+money(agg.travel),'blue')}${kpi('年間所得税',agg.hasPayment?money(agg.tax):'—',agg.hasPayment?'勤務月ベース':'未入力','amber')}${kpi('年間手取り',agg.hasPayment?money(agg.net):'—',agg.hasPayment?'勤務月ベース':'未入力','pink')}</div><section class="card" style="margin-top:18px"><div class="card-heading"><div><h2>月別の収入推移</h2><div class="month-sub">勤務月ベース／単位：円</div></div><div class="legend"><span><b style="background:#9ed4d0"></b>交通費込み額面</span><span><b style="background:#226b86"></b>手取り</span></div></div><div class="year-bars" aria-label="月別の棒グラフ">${bars}</div><div class="table-scroll" style="margin-top:19px"><table><thead><tr><th>月</th><th class="num">額面（込）</th><th class="num">額面（抜）</th><th class="num">交通費</th><th class="num">所得税</th><th class="num">手取り</th></tr></thead><tbody>${per.map((a,i)=>`<tr><td>${i+1}月</td><td class="num">${money(a.gross)}</td><td class="num">${money(a.base)}</td><td class="num">${money(a.travel)}</td><td class="num">${a.hasPayment?money(a.tax):'—'}</td><td class="num">${a.hasPayment?money(a.net):'—'}</td></tr>`).join('')}</tbody></table></div></section><div class="section-header"><h2>勤務先別の年間集計</h2><span class="pill gray">${state.year}年</span></div><section class="card"><div class="table-scroll"><table><thead><tr><th>勤務先</th><th class="num">勤務件数</th><th class="num">額面（込）</th><th class="num">額面（抜）</th><th class="num">所得税</th><th class="num">手取り</th></tr></thead><tbody>${byCompany.length?byCompany.map(x=>`<tr><td>${esc(x.company)}</td><td class="num">${x.count||'—'}</td><td class="num">${x.count?money(x.a.gross):'—'}</td><td class="num">${x.count?money(x.a.base):'—'}</td><td class="num">${x.a.hasPayment?money(x.a.tax):'—'}</td><td class="num">${x.a.hasPayment?money(x.a.net):'—'}</td></tr>`).join(''):`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:25px">まだデータはありません</td></tr>`}</tbody></table></div></section><div class="info-box" style="margin-top:16px"><strong>集計の基準</strong>年間の額面・手取りは、勤務した月に紐づけて集計しています。${state.year}年に実際に振り込まれた手取りの合計は <b>${money(annualDeposit)}</b> です。全勤務先一括で入力した所得税・手取りは勤務先に按分せず、別行に表示します。</div>${footer()}`}
function settings(){const total=data.shifts.length+data.settlements.length;return `<div class="topbar"><div><div class="eyebrow">DOCTOR PAY</div><h1>設定・データ管理</h1><div class="month-sub">勤務先の候補とバックアップを管理します</div></div></div><div class="settings-grid"><section class="card"><div class="setting-block"><h2>勤務先の候補</h2><p>勤務登録時に選べる勤務先を自由に追加・変更できます。病院名・会社名など好きな名称で登録してください。</p><form id="employer-form" class="foot-action"><input id="new-employer" class="control" type="text" maxlength="100" required placeholder="例：〇〇病院" style="flex:1;min-width:150px" aria-label="追加する勤務先"><button class="button primary" type="submit">＋ 追加</button></form><div style="margin-top:18px">${data.employers.length?data.employers.map(e=>`<div class="setting-row"><div><b>${esc(e.name)}</b><small>勤務 ${data.shifts.filter(x=>x.employerId===e.id).length}件</small></div><div class="actions"><button class="button sm" data-action="rename-employer" data-id="${esc(e.id)}">名前変更</button><button class="button sm danger" data-action="delete-employer" data-id="${esc(e.id)}">削除</button></div></div>`).join(''):empty('勤務先の候補はまだありません','上のフォームから追加してください。')}</div></div></section><section class="card"><div class="setting-block"><h2>バックアップ・書き出し</h2><p>保存した給与情報は、この端末のこのブラウザ内にあります。バックアップを別の端末に移すと同じデータを引き継げます。</p><div class="foot-action"><button class="button primary" data-action="export-json">バックアップを保存（JSON）</button><button class="button" data-action="import-json">バックアップを読み込む</button></div><input class="hidden" type="file" id="import-file" accept=".json,application/json" aria-label="バックアップファイルを選択"><div class="divider"></div><h3>Excelで開く（CSV）</h3><p>NumbersやExcelなどで確認したいときに使います。</p><div class="foot-action"><button class="button" data-action="export-shifts">勤務データCSV</button><button class="button" data-action="export-payments">振込データCSV</button></div></div><div class="info-box warning"><strong>大切：バックアップを定期的に保存してください</strong>ブラウザのデータ削除・機種変更・故障などで記録が消える場合があります。端末をまたいだ自動同期はありません。別端末への取り込みは現在のデータを置き換えます。</div></section></div><div class="section-header"><h2>このアプリについて</h2></div><section class="card"><div class="setting-row"><span>利用料金</span><strong>無料（広告・課金・外部通信なし）</strong></div><div class="setting-row"><span>登録済み勤務</span><strong>${data.shifts.length}件</strong></div><div class="setting-row"><span>振込記録</span><strong>${data.settlements.length}件</strong></div><div class="setting-row"><span>最終更新</span><strong>${data.updatedAt?new Date(data.updatedAt).toLocaleString('ja-JP'):'まだありません'}</strong></div><div class="setting-row"><span>データ保存先</span><strong>この端末のブラウザ</strong></div><div class="divider"></div><h3>今後の拡張予定</h3><p class="detail-note">確定申告向けの整理、ふるさと納税控除上限額の予測は将来機能として設計対象にしています。ふるさと納税の推定には給与収入以外の所得、所得控除、家族構成などの確認が必要なため、現行版では未実装です。</p><div class="divider"></div><button class="button danger sm" data-action="delete-all">すべての記録を削除</button></section>${footer()}`}
function footer(){return `<p class="footer-note">Doctor Pay v1.0　｜　完全無料・広告なし　｜　データは端末内保存</p>`}
function render(){document.getElementById('side-nav').innerHTML=nav();document.getElementById('mobile-nav').innerHTML=mobileNav();document.getElementById('app').innerHTML=({home,calendar,payments,analytics,settings}[state.tab]||home)()}
function modalTemplate(title,body,footer){document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" id="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><div><div class="eyebrow">DOCTOR PAY</div><h2>${esc(title)}</h2></div><button class="button icon" data-action="close-modal" aria-label="閉じる">✕</button></div>${body}${footer||''}</div></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input:not([type="hidden"]),.modal select')?.focus(),20)}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow=''}
function employerOptions(selected,includeAll=false){return (includeAll?'<option value="all"'+(selected==='all'?' selected':'')+'>全勤務先まとめて</option>':'')+data.employers.map(e=>`<option value="${esc(e.id)}" ${selected===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
function shiftModal(id,date){const x=id?data.shifts.find(x=>x.id===id):null;if(id&&!x)return;const hasCompanies=data.employers.length>0;const selected=x?.employerId||data.employers[0]?.id||'__new__';const body=`<form id="shift-form" data-id="${esc(x?.id||'')}"><div class="form-grid"><div class="field"><label for="shift-date">勤務日 *</label><input type="date" id="shift-date" class="control" value="${esc(x?.date||date||TODAY)}" required></div><div class="field"><label for="shift-employer">勤務先 *</label><select id="shift-employer" class="control" required>${employerOptions(selected)}<option value="__new__" ${!hasCompanies?'selected':''}>＋ 新しい勤務先を追加</option></select></div><div class="field full ${selected==='__new__'?'':'hidden'}" id="new-employer-wrap"><label for="shift-new-employer">新しい勤務先の名前 *</label><input id="shift-new-employer" class="control" maxlength="100" placeholder="例：〇〇病院"></div><div class="field"><label for="shift-base">額面（交通費抜き） *</label><input type="number" id="shift-base" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.base??''}" placeholder="例：80000" required></div><div class="field"><label for="shift-travel">交通費</label><input type="number" id="shift-travel" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.travel??0}" required></div><div class="field full"><div class="preview"><span>交通費込みの額面（自動計算）</span><strong id="shift-total">${money((x?.base||0)+(x?.travel||0))}</strong></div></div><div class="field full"><label for="shift-memo">メモ（任意）</label><textarea id="shift-memo" class="control" maxlength="1000" placeholder="例：当直、健診など">${esc(x?.memo||'')}</textarea></div></div><div class="modal-bottom">${x?`<button type="button" class="button danger" data-action="delete-shift" data-id="${esc(x.id)}" style="margin-right:auto">削除</button>`:''}<button type="button" class="button" data-action="close-modal">キャンセル</button><button type="submit" class="button primary">${x?'更新する':'登録する'}</button></div></form>`;modalTemplate(x?'勤務を編集':'勤務を登録',body)}
function paymentModal(id){const x=id?data.settlements.find(x=>x.id===id):null;if(id&&!x)return;const targetMonth=x?.workMonth||state.month;const body=`<form id="payment-form" data-id="${esc(x?.id||'')}"><div class="form-grid"><div class="field"><label for="pay-workmonth">対象の勤務月 *</label><input type="month" id="pay-workmonth" class="control" value="${targetMonth}" required></div><div class="field"><label for="pay-employer">勤務先・給与の単位 *</label><select id="pay-employer" class="control" required>${employerOptions(x?.employerId||'all',true)}</select></div><div class="field full"><div id="payment-target-total" class="selected-note"></div></div><div class="field"><label for="pay-date">実際の振込日 *</label><input type="date" id="pay-date" class="control" value="${esc(x?.depositDate||TODAY)}" required></div><div class="field"><label for="pay-tax">所得税（源泉徴収額） *</label><input type="number" id="pay-tax" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.tax??''}" required placeholder="例：8000"></div><div class="field full"><label for="pay-net">実際の手取り（振込金額） *</label><input type="number" id="pay-net" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.net??''}" required placeholder="例：77000"><span class="help">額面との差は自動計算しません。給与明細等の実際の金額を入力します。</span></div><div class="field full"><label for="pay-memo">メモ（任意）</label><textarea id="pay-memo" class="control" maxlength="1000" placeholder="例：11月勤務5回分">${esc(x?.memo||'')}</textarea></div></div><div class="modal-bottom">${x?`<button type="button" class="button danger" data-action="delete-payment" data-id="${esc(x.id)}" style="margin-right:auto">削除</button>`:''}<button type="button" class="button" data-action="close-modal">キャンセル</button><button type="submit" class="button primary">${x?'更新する':'登録する'}</button></div></form>`;modalTemplate(x?'給与振込を編集':'給与振込を登録',body);updatePaymentTarget()}
function updatePaymentTarget(){const month=document.getElementById('pay-workmonth')?.value,employerId=document.getElementById('pay-employer')?.value,out=document.getElementById('payment-target-total');if(!out)return;const s=data.shifts.filter(x=>x.date.slice(0,7)===month&&(employerId==='all'||x.employerId===employerId));out.textContent='参考：対象勤務記録 '+s.length+'件 ／ 交通費込みの額面 '+money(s.reduce((a,x)=>a+x.base+x.travel,0))+'（振込額とは異なる場合があります）'}
function dayModal(date){const ss=data.shifts.filter(x=>x.date===date);const dateStr=date.replaceAll('-','/');modalTemplate(dateStr+' の勤務',`<div class="card-heading"><h3>この日の勤務：${ss.length}件</h3><button class="button primary sm" data-action="add-shift-on" data-date="${date}">＋ この日に登録</button></div>${ss.length?ss.map(shiftLine).join(''):empty('この日の勤務はありません','勤務を登録するとカレンダーに金額が表示されます。')}<div class="modal-bottom"><button class="button" data-action="close-modal">閉じる</button></div>`)}
function toast(msg){const root=document.getElementById('toast-root');if(!root)return;root.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>{root.innerHTML=''},3000)}
function saveShift(form){const id=form.dataset.id,date=document.getElementById('shift-date').value,base=Number(document.getElementById('shift-base').value),travel=Number(document.getElementById('shift-travel').value);let employerId=document.getElementById('shift-employer').value;if(!validDate(date)||!Number.isInteger(base)||!Number.isInteger(travel)||base<0||travel<0||base>1e9||travel>1e9){alert('勤務日と金額を確認してください。');return}if(employerId==='__new__'){const name=document.getElementById('shift-new-employer').value.trim();if(!name){alert('勤務先の名前を入力してください。');return}const existing=data.employers.find(x=>x.name===name);if(existing)employerId=existing.id;else{employerId=uid();data.employers.push({id:employerId,name})}}if(!data.employers.some(x=>x.id===employerId)){alert('勤務先を選んでください。');return}const next={id:id||uid(),date,employerId,base,travel,memo:document.getElementById('shift-memo').value.trim()};if(id){const i=data.shifts.findIndex(x=>x.id===id);if(i<0)return;data.shifts[i]=next}else data.shifts.push(next);if(save()){closeModal();toast(id?'勤務を更新しました':'勤務を登録しました')}}
function savePayment(form){const id=form.dataset.id,workMonth=document.getElementById('pay-workmonth').value,employerId=document.getElementById('pay-employer').value,depositDate=document.getElementById('pay-date').value,tax=Number(document.getElementById('pay-tax').value),net=Number(document.getElementById('pay-net').value);if(!validMonth(workMonth)||!validDate(depositDate)||!Number.isInteger(tax)||!Number.isInteger(net)||tax<0||net<0||tax>1e9||net>1e9){alert('対象月・振込日と金額を確認してください。');return}const others=data.settlements.filter(x=>x.workMonth===workMonth&&x.id!==id);if(others.some(x=>x.employerId===employerId)){if(!confirm('同じ勤務月・勤務先の振込記録が既にあります。複数の振込として合算しますか？'))return}if((employerId==='all'&&others.some(x=>x.employerId!=='all'))||(employerId!=='all'&&others.some(x=>x.employerId==='all'))){if(!confirm('同じ勤務月に「全勤務先まとめて」と「個別勤務先」の振込記録が混在しています。二重計上にならないかご確認ください。続けますか？'))return}const next={id:id||uid(),workMonth,employerId,depositDate,tax,net,memo:document.getElementById('pay-memo').value.trim()};if(id){const i=data.settlements.findIndex(x=>x.id===id);if(i<0)return;data.settlements[i]=next}else data.settlements.push(next);if(save()){closeModal();toast(id?'振込情報を更新しました':'振込情報を登録しました')}}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s)&&isNaN(Number(s)))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csv(name,rows){downloadFile(name,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function exportShifts(){const rows=[['勤務日','勤務先','額面（交通費込み）','額面（交通費抜き）','交通費','メモ'],...data.shifts.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,employerName(x.employerId),x.base+x.travel,x.base,x.travel,x.memo])];csv('doctorpay_勤務_'+TODAY+'.csv',rows);toast('勤務CSVを書き出しました')}
function exportPayments(){const rows=[['対象勤務月','勤務先・給与単位','振込日','所得税（源泉徴収額）','手取り（振込金額）','メモ'],...data.settlements.slice().sort((a,b)=>a.depositDate.localeCompare(b.depositDate)).map(x=>[x.workMonth,employerName(x.employerId),x.depositDate,x.tax,x.net,x.memo])];csv('doctorpay_振込_'+TODAY+'.csv',rows);toast('振込CSVを書き出しました')}
function importJSON(file){if(!file)return;if(file.size>5e6){alert('ファイルが大きすぎます（最大5MB）。');return}file.text().then(txt=>{let parsed;try{parsed=normalize(JSON.parse(txt))}catch(e){alert('読み込みに失敗しました：'+e.message);return}const msg='このバックアップを読み込むと、現在のこの端末の記録はすべて置き換わります。\n\n勤務 '+parsed.shifts.length+'件／振込 '+parsed.settlements.length+'件\n\n現在の記録を保存してから操作することをおすすめします。続けますか？';if(!confirm(msg))return;data=parsed;if(save())toast('バックアップを読み込みました')}).catch(()=>alert('ファイルを読み込めませんでした'))}
function navTo(tab){state.tab=tab;render();scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;switch(action){case'nav':navTo(btn.dataset.tab);break;case'prev-month':state.month=monthOffset(state.month,-1);render();break;case'next-month':state.month=monthOffset(state.month,1);render();break;case'prev-year':state.year--;render();break;case'next-year':state.year++;render();break;case'add-shift':shiftModal();break;case'add-shift-on':shiftModal(null,btn.dataset.date);break;case'edit-shift':shiftModal(id);break;case'open-day':dayModal(btn.dataset.date);break;case'add-payment':paymentModal();break;case'edit-payment':paymentModal(id);break;case'close-modal':closeModal();break;case'delete-shift':if(confirm('この勤務記録を削除しますか？')){data.shifts=data.shifts.filter(x=>x.id!==id);if(save()){closeModal();toast('勤務を削除しました')}}break;case'delete-payment':if(confirm('この振込記録を削除しますか？')){data.settlements=data.settlements.filter(x=>x.id!==id);if(save()){closeModal();toast('振込情報を削除しました')}}break;case'rename-employer':{const emp=data.employers.find(x=>x.id===id);if(!emp)return;const name=prompt('勤務先の新しい名前を入力してください',emp.name);if(name===null)return;const val=name.trim();if(!val||val.length>100)return alert('1～100文字で入力してください');if(data.employers.some(x=>x.name===val&&x.id!==id))return alert('同じ名前の勤務先が存在します');emp.name=val;if(save())toast('勤務先の名前を変更しました');break}case'delete-employer':{const emp=data.employers.find(x=>x.id===id);if(!emp)return;if(data.shifts.some(x=>x.employerId===id)||data.settlements.some(x=>x.employerId===id))return alert('この勤務先には勤務・振込記録があるため削除できません。名称変更は可能です。');if(confirm('「'+emp.name+'」を候補から削除しますか？')){data.employers=data.employers.filter(x=>x.id!==id);if(save())toast('勤務先を削除しました')}break}case'export-json':downloadFile('doctorpay_backup_'+TODAY+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('バックアップを保存しました');break;case'import-json':document.getElementById('import-file')?.click();break;case'export-shifts':exportShifts();break;case'export-payments':exportPayments();break;case'delete-all':{if(!confirm('全勤務・全振込・勤務先をすべて削除します。元に戻せません。バックアップは保存しましたか？'))return;if(!confirm('最終確認：すべての記録を削除しますか？'))return;data={version:1,employers:[],shifts:[],settlements:[],updatedAt:null};if(save())toast('すべての記録を削除しました');break}}});
document.addEventListener('submit',e=>{if(e.target.id==='shift-form'){e.preventDefault();saveShift(e.target)}else if(e.target.id==='payment-form'){e.preventDefault();savePayment(e.target)}else if(e.target.id==='employer-form'){e.preventDefault();const el=document.getElementById('new-employer'),name=el.value.trim();if(!name)return;if(data.employers.some(x=>x.name===name))return alert('この名前は登録済みです');data.employers.push({id:uid(),name});if(save())toast('勤務先を追加しました')}});
document.addEventListener('change',e=>{if(e.target.id==='month-picker'){if(validMonth(e.target.value)){state.month=e.target.value;render()}}else if(e.target.id==='shift-employer'){const n=document.getElementById('new-employer-wrap');if(n)n.classList.toggle('hidden',e.target.value!=='__new__')}else if(e.target.id==='pay-workmonth'||e.target.id==='pay-employer'){updatePaymentTarget()}else if(e.target.id==='import-file'){importJSON(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='shift-base'||e.target.id==='shift-travel'){const base=Number(document.getElementById('shift-base')?.value||0),travel=Number(document.getElementById('shift-travel')?.value||0),o=document.getElementById('shift-total');if(o)o.textContent=money(base+travel)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-wrap'))closeModal()});
document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.id==='modal-wrap')closeModal()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
window.__doctorPayDebug={getData:()=>structuredClone(data),getState:()=>({...state})};
})();
</script>
</body>
