function money(n){return new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0))+'円'}
function shortMoney(n){n=Number(n)||0;return n>=100000 ? (n/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万' : new Intl.NumberFormat('ja-JP').format(n)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function validMonth(s){return typeof s==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(s)}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return !isNaN(d)&&localISO(d)===s}
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
function num(v){let n=Number(v);return Number.isFinite(n)?Math.max(0,Math.round(n)):0}
function normalize(v){
 if(!v||![1,2,3,4].includes(v.version)||!Array.isArray(v.shifts)||!Array.isArray(v.employers)||!Array.isArray(v.settlements))throw Error('対応していないバックアップ形式です');
 const employers=v.employers.filter(x=>x&&x.id&&x.name).map(x=>({id:String(x.id),name:String(x.name).slice(0,100),closingDay:payDayNum(x.closingDay,'last'),payDay:payDayNum(x.payDay,'last'),payMonthOffset:[0,1,2].includes(Number(x.payMonthOffset))?Number(x.payMonthOffset):1}));
 const ids=new Set(employers.map(x=>x.id));
 const defaults=[{id:'type-night',name:'当直'},{id:'type-checkup',name:'健診'},{id:'type-influenza',name:'インフル問診'}];
 const workTypes=(Array.isArray(v.workTypes)?v.workTypes:defaults).filter(x=>x&&x.id&&x.name).map(x=>({id:String(x.id),name:String(x.name).slice(0,100)}));
 const typeIds=new Set(workTypes.map(x=>x.id));
 const shifts=v.shifts.filter(x=>x&&validDate(x.date)&&ids.has(String(x.employerId))).map(x=>({id:String(x.id||uid()),date:x.date,employerId:String(x.employerId),workTypeId:typeIds.has(String(x.workTypeId))?String(x.workTypeId):'',base:num(x.base),travel:num(x.travel),memo:String(x.memo||'').slice(0,1000)}));
 const shiftIds=new Set(shifts.map(x=>x.id));
 const settlements=v.settlements.filter(x=>x&&validMonth(x.workMonth)&&validDate(x.depositDate)&&(x.employerId==='all'||ids.has(String(x.employerId)))).map(x=>{
  let linked;
  if(Array.isArray(x.shiftIds))linked=x.shiftIds.map(String).filter(id=>shiftIds.has(id));
  else linked=x.employerId==='all'?[]:shifts.filter(s=>s.employerId===x.employerId&&s.date.slice(0,7)===x.workMonth).map(s=>s.id);
  return{id:String(x.id||uid()),workMonth:x.workMonth,periodEnd:validDate(x.periodEnd)?x.periodEnd:lastDayOfMonth(x.workMonth),depositDate:x.depositDate,employerId:String(x.employerId),shiftIds:[...new Set(linked)],tax:num(x.tax),net:num(x.net),memo:String(x.memo||'').slice(0,1000)};
 });
 const templates=(Array.isArray(v.templates)?v.templates:[]).filter(x=>x&&x.id&&ids.has(String(x.employerId))).map(x=>({id:String(x.id),name:String(x.name||'よく使う勤務').slice(0,100),employerId:String(x.employerId),workTypeId:typeIds.has(String(x.workTypeId))?String(x.workTypeId):'',base:num(x.base),travel:num(x.travel),memo:String(x.memo||'').slice(0,1000)}));
 const taxProfiles={};
 if(v.taxProfiles&&typeof v.taxProfiles==='object'&&!Array.isArray(v.taxProfiles))for(const [y,t] of Object.entries(v.taxProfiles)){
  if(!/^20\d{2}$/.test(y)||!t||typeof t!=='object')continue;
  taxProfiles[y]={social:num(t.social),pension:num(t.pension),medical:num(t.medical),futureIncome:num(t.futureIncome),salaryOverride:t.salaryOverride==null?null:num(t.salaryOverride),withheldOverride:t.withheldOverride==null?null:num(t.withheldOverride)};
 }
 return {version:4,employers,workTypes,shifts,settlements,templates,taxProfiles,updatedAt:typeof v.updatedAt==='string'?v.updatedAt:null};
}
function payDayNum(v,def='last'){return v==='last'||v===31||v==='31'?'last':(Number.isInteger(Number(v))&&Number(v)>=1&&Number(v)<=30?Number(v):def)}
function lastDayOfMonth(month){const [y,m]=month.split('-').map(Number);return localISO(new Date(y,m,0))}
function isoInMonth(month,day){const [y,m]=month.split('-').map(Number);return localISO(new Date(y,m-1,Math.min(day==='last'?31:day,new Date(y,m,0).getDate())))}
function nextDay(date){const [y,m,d]=date.split('-').map(Number);return localISO(new Date(y,m-1,d+1))}
function employerById(id){const e=data.employers.find(x=>x.id===id)||{};return {...e,closingDay:e.closingDay??'last',payDay:e.payDay??'last',payMonthOffset:e.payMonthOffset??1}}
function periodEndForShift(shift){const emp=employerById(shift.employerId),month=shift.date.slice(0,7),end=isoInMonth(month,emp.closingDay);return shift.date<=end?end:isoInMonth(monthOffset(month,1),emp.closingDay)}
function expectedPayDate(end,employerId){const emp=employerById(employerId);return isoInMonth(monthOffset(end.slice(0,7),emp.payMonthOffset),emp.payDay)}
function periodStart(end,employerId){const emp=employerById(employerId);return nextDay(isoInMonth(monthOffset(end.slice(0,7),-1),emp.closingDay))}
function periodLabel(end,id){return `${periodStart(end,id).replaceAll('-','/')}〜${end.replaceAll('-','/')}`}
function scheduleLabel(e){return `${e.closingDay==='last'?'末日':e.closingDay+'日'}締め・${e.payMonthOffset===0?'当月':e.payMonthOffset===1?'翌月':'翌々月'}${e.payDay==='last'?'末日':e.payDay+'日'}払い`}
function periodGroups(employerId){const grouped=new Map();for(const x of data.shifts.filter(x=>x.employerId===employerId)){const end=periodEndForShift(x);if(!grouped.has(end))grouped.set(end,[]);grouped.get(end).push(x)}return [...grouped.entries()].map(([end,shifts])=>({end,shifts,payDate:expectedPayDate(end,employerId)})).sort((a,b)=>b.end.localeCompare(a.end))}
function linkedShifts(payment){return data.shifts.filter(x=>payment.shiftIds?.includes(x.id)&&x.employerId===payment.employerId)}
function projectedYearForShift(shift){const payment=data.settlements.filter(p=>p.employerId===shift.employerId&&p.shiftIds?.includes(shift.id)).sort((a,b)=>a.depositDate.localeCompare(b.depositDate))[0];return Number((payment?.depositDate||expectedPayDate(periodEndForShift(shift),shift.employerId)).slice(0,4))}
function linkedForYear(year){const payments=data.settlements.filter(x=>x.depositDate.startsWith(String(year)+'-'));const valid=payments.filter(x=>x.employerId!=='all'&&linkedShifts(x).length>0);const ids=new Set(valid.flatMap(p=>linkedShifts(p).map(s=>s.id)));const wages=data.shifts.filter(s=>ids.has(s.id));return {payments:valid,wages,withholding:valid.reduce((n,p)=>n+p.tax,0),net:valid.reduce((n,p)=>n+p.net,0),excluded:payments.length-valid.length};}
function load(){try{const txt=localStorage.getItem(KEY);if(txt)return normalize(JSON.parse(txt))}catch(e){console.error('データ読み込み失敗:',e);setTimeout(()=>toast('保存データを読み込めません。設定からバックアップを確認してください。'),0)}return normalize({version:1,employers:[],shifts:[],settlements:[],updatedAt:null})}
function save(){try{data.version=4;data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));render();return true}catch(e){alert('端末への保存に失敗しました。ブラウザの空き容量・プライベートモードを確認してください。');return false}}
function employerName(id){return id==='all'?'旧式の一括振込（要修正）':(data.employers.find(e=>e.id===id)||{}).name||'不明な勤務先'}
function workTypeName(id){return (data.workTypes.find(t=>t.id===id)||{}).name||'未設定'}
function monthShifts(m){return data.shifts.filter(x=>x.date.slice(0,7)===m).sort((a,b)=>a.date.localeCompare(b.date)||employerName(a.employerId).localeCompare(employerName(b.employerId),'ja'))}
function monthSettlements(m){return data.settlements.filter(x=>x.workMonth===m).sort((a,b)=>a.depositDate.localeCompare(b.depositDate))}
function deposits(m){return data.settlements.filter(x=>x.depositDate.slice(0,7)===m).sort((a,b)=>a.depositDate.localeCompare(b.depositDate))}
function aggregate(shifts,settlements){return{base:shifts.reduce((a,x)=>a+x.base,0),travel:shifts.reduce((a,x)=>a+x.travel,0),gross:shifts.reduce((a,x)=>a+x.base+x.travel,0),tax:settlements.reduce((a,x)=>a+x.tax,0),net:settlements.reduce((a,x)=>a+x.net,0),hasPayment:settlements.length>0}}
function kpi(title,value,sub,color){return `<div class="card kpi"><div class="title"><i class="dot ${color||''}"></i>${title}</div><div class="value">${value}</div><div class="detail">${sub}</div></div>`}
function nav(){return pages.map(([id,name])=>`<button class="side-link ${state.tab===id?'active':''}" data-action="nav" data-tab="${id}" aria-current="${state.tab===id?'page':'false'}">${svg[id==='payments'?'wallet':id==='analytics'?'chart':id]}<span>${name}</span></button>`).join('')}
function mobileNav(){return pages.map(([id,name])=>`<button data-action="nav" data-tab="${id}" class="${state.tab===id?'active':''}" aria-label="${name}">${svg[id==='payments'?'wallet':id==='analytics'?'chart':id]}<span>${name}</span></button>`).join('')}
function monthControl(){return `<div class="month-controls"><button class="button icon" data-action="prev-month" aria-label="前月">‹</button><label class="month-picker-wrap"><span class="month-display">${monthTitle(state.month)} ▾</span><input class="month-picker" type="month" id="month-picker" value="${state.month}" aria-label="対象月"></label><button class="button icon" data-action="next-month" aria-label="翌月">›</button></div>`}
function yearControl(){return `<div class="month-controls"><button class="button icon" data-action="prev-year" aria-label="前年">‹</button><strong style="font-size:17px;padding:0 8px">${state.year}年</strong><button class="button icon" data-action="next-year" aria-label="翌年">›</button></div>`}
function header(title,subtitle,showMonth=true,action='shift'){return `<div class="topbar"><div><div class="eyebrow">DOCTOR PAY</div><h1>${title}</h1><div class="month-sub">${subtitle}</div></div><div class="top-actions">${showMonth?monthControl():''}${action==='shift'?'<button class="button primary" data-action="add-shift">＋ 勤務を登録</button>':action==='payment'?'<button class="button primary" data-action="add-payment">＋ 給与振込を登録</button>':''}</div></div>`}
function shiftLine(x){const dt=new Date(x.date+'T12:00:00'),md=(dt.getMonth()+1)+'/'+dt.getDate();return `<div class="rowline"><div class="lead"><div class="date-badge">${md}<div class="muted">${'日月火水木金土'[dt.getDay()]}</div></div><div style="min-width:0"><div class="names">${esc(employerName(x.employerId))} <span class="pill gray">${esc(workTypeName(x.workTypeId))}</span></div><div class="sub">交通費なし ${money(x.base)}${x.memo?' ・ '+esc(x.memo):''}</div></div></div><div><div class="money">${money(x.base+x.travel)}</div><div class="actions"><button class="text-button" data-action="edit-shift" data-id="${esc(x.id)}">編集</button><button class="text-button" data-action="bulk-from-shift" data-id="${esc(x.id)}">別日にコピー</button><button class="text-button" data-action="template-from-shift" data-id="${esc(x.id)}">定型登録</button></div></div></div>`}
function settlementLine(x){return `<div class="rowline"><div class="lead"><div class="date-badge">${esc(x.depositDate.slice(5).replace('-','/'))}</div><div style="min-width:0"><div class="names">${esc(employerName(x.employerId))}</div><div class="sub">${x.employerId==='all'?'旧形式・紐づけなし':`対象 ${esc(periodLabel(x.periodEnd,x.employerId))}・${x.shiftIds?.length||0}件`} ・ 源泉徴収額 ${money(x.tax)}${x.memo?' ・ '+esc(x.memo):''}</div></div></div><div><div class="money">${money(x.net)}</div><div class="actions"><button class="text-button" data-action="edit-payment" data-id="${esc(x.id)}">編集</button></div></div></div>`}
function empty(title,sub,action,text){return `<div class="empty"><div class="big">▤</div><b>${title}</b><div>${sub}</div>${action?`<button class="button sm primary" data-action="${action}">${text||'登録する'}</button>`:''}</div>`}
function home(){const s=monthShifts(state.month),p=deposits(state.month),a=aggregate(s,p),d=p,received=d.reduce((n,x)=>n+x.net,0);const title=monthTitle(state.month);return header('給与ダッシュボード','単発勤務の収入をひと目で確認')+`<div class="hero"><div><h2>${title}の勤務実績</h2><p>勤務日の記録から、交通費込みの額面を自動集計します。<br>源泉徴収額・手取りは振込後に追加できます。</p></div><div><div class="hero-label">交通費込みの額面</div><div class="hero-number">${money(a.gross)}</div></div></div><div class="kpi-grid">${kpi('交通費込み額面',money(a.gross),s.length+'件の勤務記録')}${kpi('交通費抜き額面',money(a.base),'交通費 '+money(a.travel),'blue')}${kpi('源泉徴収額',a.hasPayment?money(a.tax):'—',a.hasPayment?'振込情報 '+p.length+'件':'振込後に入力','amber')}${kpi('手取り',a.hasPayment?money(a.net):'—',a.hasPayment?'振込月ベース':'振込後に入力','pink')}</div><div class="section-grid" style="margin-top:19px"><section class="card"><div class="card-heading"><h2>勤務の一覧 <span class="pill gray">${s.length}件</span></h2><button class="button sm" data-action="nav" data-tab="calendar">カレンダーを見る</button></div>${s.length?s.slice(0,6).map(shiftLine).join('')+ (s.length>6?`<button class="button ghost" data-action="nav" data-tab="calendar">他 ${s.length-6}件を表示</button>`:''):empty('この月の勤務登録はありません','カレンダーから日付ごとに登録できます。',null,null)}</section><section class="card"><div class="card-heading"><h2>給与振込の記録</h2></div><div class="split-summaries" style="margin-bottom:14px"><div class="small-stat"><span>今月実際に振り込まれた手取り</span><strong>${d.length?money(received):'—'}</strong></div></div>${p.length?p.slice(0,4).map(settlementLine).join(''):empty('振込情報はまだありません','源泉徴収額と手取りは振込後に登録できます。',null,null)}</section></div><div class="info-box" style="margin-top:16px"><strong>勤務月と振込月は別々に管理します</strong>上の額面は「${title}に働いた分」、振込の手取りは「実際に口座へ入った月」で確認できます。未入力の手取りは0円ではなく「—」と表示します。</div>${footer()}`}
function calendar(){const [year,month]=state.month.split('-').map(Number);const first=new Date(year,month-1,1).getDay(),last=new Date(year,month,0).getDate();const totalCells=Math.ceil((first+last)/7)*7;let cells='';const ss=monthShifts(state.month);for(let i=0;i<totalCells;i++){const day=i-first+1,valid=day>0&&day<=last;let date,items=[];if(valid){date=state.month+'-'+String(day).padStart(2,'0');items=ss.filter(x=>x.date===date)}let gross=items.reduce((n,x)=>n+x.base+x.travel,0);cells+=`<button class="day ${valid?'':'other'} ${date===TODAY?'today':''}" ${valid?`data-action="open-day" data-date="${date}" aria-label="${day}日、${items.length}件、額面${money(gross)}"`:'disabled aria-hidden="true"'}><span class="day-num">${valid?day:''}</span>${items.length?`<span class="day-total">${shortMoney(gross)}</span>${items.slice(0,2).map(x=>`<span class="day-company">${esc(employerName(x.employerId))}・${esc(workTypeName(x.workTypeId))}</span>`).join('')}${items.length>2?`<span class="day-add">他${items.length-2}件</span>`:''}`:valid?'<span class="day-add">＋</span>':''}</button>`}return header('勤務カレンダー','日付をタップして勤務を登録・編集')+`<div class="card calendar-card calendar-wrap"><div class="card-heading" style="padding:2px 6px 0"><h2>${monthTitle(state.month)}</h2><span class="calendar-legend">金額は交通費込みの額面</span></div><div class="weekday-grid">${['日','月','火','水','木','金','土'].map(x=>`<div class="weekday">${x}</div>`).join('')}</div><div class="calendar-grid">${cells}</div></div><div class="section-header"><h2>この月の勤務 <span class="pill gray">${ss.length}件</span></h2></div><div class="card">${ss.length?ss.map(shiftLine).join(''):empty('勤務の登録がありません','カレンダーの日付をタップしてください。')}</div>${footer()}`}
function payments(){
 const d=deposits(state.month),taxSum=d.reduce((n,x)=>n+x.tax,0),actual=d.reduce((n,x)=>n+x.net,0);
 return header('給与振込','勤務先ごとの締め期間に紐づけて記録',true,'payment')+
 `<div class="info-box"><strong>振込を勤務に紐づけます</strong>勤務先を選ぶと、設定済みの締め日で勤務を自動集計します。対象期間と実際の振込日・源泉徴収額・手取りを入力してください。源泉徴収額は「額面－手取り」ではありません。</div>
 <div class="kpi-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px">${kpi(monthTitle(state.month)+'の源泉徴収額',d.length?money(taxSum):'—','実際の振込月ベース','amber')}${kpi(monthTitle(state.month)+'の手取り',d.length?money(actual):'—','実際の振込月ベース','pink')}</div>
 <div class="section-header"><h2>${monthTitle(state.month)}の振込実績</h2><span class="pill gray">${d.length}件</span></div>
 <div class="card">${d.length?d.map(settlementLine).join(''):empty('この月の入金記録はありません','画面上部の「給与振込を登録」から入力してください。')}</div>
 <p class="detail-note">勤務月と入金月が異なる場合は、入金日の月に表示します。支給日の税務上の帰属年は、実際の入金日と異なることがあります。</p>${footer()}`;

function analytics(){const months=Array.from({length:12},(_,i)=>state.year+'-'+String(i+1).padStart(2,'0'));const records=data.shifts.filter(x=>x.date.startsWith(String(state.year)+'-'));const pays=data.settlements.filter(x=>x.depositDate.startsWith(String(state.year)+'-'));const agg=aggregate(records,pays);const per=months.map(m=>aggregate(monthShifts(m),deposits(m)));const max=Math.max(1,...per.map(x=>x.gross));const bars=per.map((x,i)=>`<div class="bar-col"><div class="bar-inner"><div class="bar" style="height:${x.gross?Math.max(2,100*x.gross/max):0}%" title="${i+1}月 額面 ${money(x.gross)}"></div><div class="bar net" style="height:${x.hasPayment?Math.max(2,100*x.net/max):0}%" title="${i+1}月 手取り ${x.hasPayment?money(x.net):'未入力'}"></div></div><span class="bar-label">${i+1}月</span></div>`).join('');const annualDeposit=data.settlements.filter(x=>x.depositDate.startsWith(String(state.year)+'-')).reduce((n,x)=>n+x.net,0);const byCompany=data.employers.map(e=>{const sr=records.filter(x=>x.employerId===e.id),pr=pays.filter(x=>x.employerId===e.id);return{company:e.name,a:aggregate(sr,pr),count:sr.length}}).filter(x=>x.count>0||x.a.hasPayment).sort((a,b)=>b.a.gross-a.a.gross);const unassigned=pays.filter(x=>x.employerId==='all');if(unassigned.length)byCompany.push({company:'全勤務先まとめて（振込のみ）',a:aggregate([],unassigned),count:0});return `<div class="topbar"><div><div class="eyebrow">DOCTOR PAY</div><h1>集計・分析</h1><div class="month-sub">年間の収入と勤務先別の内訳</div></div><div class="top-actions">${yearControl()}<button class="button" data-action="export-shifts">CSV出力</button></div></div><div class="kpi-grid">${kpi('年間額面（交通費込）',money(agg.gross),records.length+'件の勤務')}${kpi('年間額面（交通費抜）',money(agg.base),'交通費 '+money(agg.travel),'blue')}${kpi('年間源泉徴収額',agg.hasPayment?money(agg.tax):'—',agg.hasPayment?'振込月ベース':'未入力','amber')}${kpi('年間手取り',agg.hasPayment?money(agg.net):'—',agg.hasPayment?'振込月ベース':'未入力','pink')}</div><section class="card" style="margin-top:18px"><div class="card-heading"><div><h2 urn {name:workTypeName(id),count:rs.length,base:rs.reduce((n,x)=>n+x.base,0),travel:rs.reduce((n,x)=>n+x.travel,0)}}).sort((a,b)=>b.base-a.base).map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${x.count}</td><td class="num">${money(x.base)}</td><td class="num">${money(x.travel)}</td><td class="num">${money(x.base+x.travel)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="text-align:center">まだ勤務記録はありません</td></tr>'}</tbody></table></div></section><div class="info-box" style="margin-top:16px"><strong>集計の基準</strong>年間額面は勤務月、源泉徴収額・手取りは振込月で集計しています。${state.year}年に実際に振り込まれた手取りの合計は <b>${money(annualDeposit)}</b> です。旧版の全勤務先一括記録は表示しますが、勤務との紐づけがないため還付試算から除外します。</div>${footer()}`}

function getTaxProfile(y){const p=data.taxProfiles[String(y)]||{};return {social:num(p.social),pension:num(p.pension),medical:num(p.medical),futureIncome:num(p.futureIncome),salaryOverride:p.salaryOverride==null?null:num(p.salaryOverride),withheldOverride:p.withheldOverride==null?null:num(p.withheldOverride)}}
function salaryDeduction(v){if(v<=0)return 0;if(v<=2200000)return Math.min(v,740000);if(v<=3600000)return Math.min(v,v*.30+80000);if(v<=6600000)return v*.20+440000;if(v<=8500000)return v*.10+1100000;return 1950000}
function incomeBasicDeduction(income){if(income<=4890000)return 1040000;if(income<=6550000)return 670000;if(income<=23500000)return 620000;if(income<=24000000)return 480000;if(income<=24500000)return 320000;if(income<=25000000)return 160000;return 0}
function residentBasicDeduction(income){if(income<=24000000)return 430000;if(income<=24500000)return 290000;if(income<=25000000)return 150000;return 0}
function incomeBracket(v){if(v<1950000)return [.05,0];if(v<3300000)return [.10,97500];if(v<6950000)return [.20,427500];if(v<9000000)return [.23,636000];if(v<18000000)return [.33,1536000];if(v<40000000)return [.40,2796000];return [.45,4796000]}
function incomeTaxAt(taxable){const amount=Math.floor(Math.max(0,taxable)/1000)*1000;if(!amount)return 0;const [rate,deduct]=incomeBracket(amount);return Math.max(0,Math.floor((amount*rate-deduct)*1.021))}
function taxProjection(year){
 const p=getTaxProfile(year),yearShifts=data.shifts.filter(x=>projectedYearForShift(x)===Number(year));
 const salaryFromShifts=yearShifts.reduce((sum,x)=>sum+x.base,0);
 const autoSalaryPast=yearShifts.filter(x=>x.date<=TODAY).reduce((sum,x)=>sum+x.base,0);
 const autoSalaryFuture=salaryFromShifts-autoSalaryPast;
 const salaryBase=p.salaryOverride===null?salaryFromShifts:p.salaryOverride;
 const salary=salaryBase+p.futureIncome,deductions=p.social+p.pension+p.medical;
 function taxParts(annual){const salaryIncome=Math.max(0,annual-salaryDeduction(annual)),basic=incomeBasicDeduction(salaryIncome),residentBasic=residentBasicDeduction(salaryIncome);return{salaryIncome,basic,taxableIncome:Math.max(0,salaryIncome-basic-deductions),residentTaxable:Math.max(0,salaryIncome-residentBasic-deductions)}}
 const {salaryIncome,basic,taxableIncome,residentTaxable}=taxParts(salary);
 const residentAdjusted=Math.floor(residentTaxable/1000)*1000;
 const residentAdjustment=residentAdjusted<=2000000?Math.min(2500,residentAdjusted*.05):2500;
 const residentBefore=Math.max(0,Math.floor(residentAdjusted*.10-residentAdjustment));
 const specialTaxBase=Math.max(0,residentAdjusted-50000-Math.max(0,basic-480000));
 const rate=specialTaxBase>0?incomeBracket(specialTaxBase)[0]:0;
 const specialRate=.9-rate*1.021;
 const theoretical=(residentBefore>0&&specialRate>0)?2000+residentBefore*.20/specialRate:0;
 const cap=Math.max(0,Math.floor(Math.min(theoretical,Math.max(0,salaryIncome*.30))));
 // 申告差額の計算には、対象年に実際に振込登録され、勤務記録との紐づけが存在するものだけを含める。
 const matched=linkedForYear(year),matchedSalary=matched.wages.reduce((n,x)=>n+x.base,0);
 const annualWithholding=matched.withholding,totalNet=matched.net;
 const hasWithholding=matched.payments.length>0;
 const estimatedIncomeTax=incomeTaxAt(taxParts(matchedSalary).taxableIncome);
 const difference=hasWithholding&&matchedSalary>0?annualWithholding-estimatedIncomeTax:null;
 return {p,salary,salaryBase,salaryFromShifts,autoSalaryPast,autoSalaryFuture,salaryIncome,basic,deductions,taxableIncome,residentTaxable,residentBefore,residentAdjustment,rate,cap,annualWithholding,totalNet,hasWithholding,estimatedIncomeTax,difference,records:matched.payments.length,matchedShifts:matched.wages.length,matchedSalary,excluded:matched.excluded,shifts:yearShifts.length};
}

function footer(){return `<p class="footer-note">Doctor Pay v4.0　｜　完全無料・端末内保存　｜　所得税・寄附上限は推定値</p>`}
function render(){document.getElementById('side-nav').innerHTML=nav();document.getElementById('mobile-nav').innerHTML=mobileNav();document.getElementById('app').innerHTML=({home,calendar,payments,analytics,tax,settings}[state.tab]||home)()}
function modalTemplate(title,body,footer){document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" id="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><div><div class="eyebrow">DOCTOR PAY</div><h2>${esc(title)}</h2></div><button class="button icon" data-action="close-modal" aria-label="閉じる">✕</button></div>${body}${footer||''}</div></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input:not([type="hidden"]),.modal select')?.focus(),20)}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow=''}
function employerOptions(selected,includeAll=false){return (includeAll?'<option value="all"'+(selected==='all'?' selected':'')+'>全勤務先まとめて</option>':'')+data.employers.map(e=>`<option value="${esc(e.id)}" ${selected===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
function shiftModal(id,date,preset){const x=id?data.shifts.find(x=>x.id===id):preset||null;if(id&&!x)return;const hasCompanies=data.employers.length>0;const selected=x?.employerId||data.employers[0]?.id||'__new__';const body=`<form id="shift-form" data-id="${esc(id||'')}">${!id&&data.templates.length?`<div class="field" style="margin-bottom:14px"><label for="shift-template">よく使うバイト（任意）</label><select id="shift-template" class="control"><option value="">新規入力</option>${data.templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></div>`:''}<div class="form-grid"><div class="field"><label for="shift-date">勤務日 *</label><input type="date" id="shift-date" class="control" value="${esc(id?x.date:date||TODAY)}" required></div><div class="field"><label for="shift-employer">勤務先 *</label><select id="shift-employer" class="control" required>${employerOptions(selected)}<option value="__new__" ${!hasCompanies?'selected':''}>＋ 新しい勤務先を追加</option></select></div><div class="field full ${selected==='__new__'?'':'hidden'}" id="new-employer-wrap"><label for="shift-new-employer">新しい勤務先の名前 *</label><input id="shift-new-employer" class="control" maxlength="100" placeholder="例：〇〇病院"></div><div class="field"><label for="shift-worktype">仕事の種類</label><select id="shift-worktype" class="control"><option value="">未設定</option>${data.workTypes.map(t=>`<option value="${esc(t.id)}" ${x?.workTypeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}<option value="__new__">＋ 新しい種類を追加</option></select></div><div class="field hidden" id="new-worktype-wrap"><label for="shift-new-worktype">新しい仕事の種類</label><input id="shift-new-worktype" class="control" maxlength="100" placeholder="例：外来"></div><div class="field"><label for="shift-base">額面（交通費抜き） *</label><input type="number" id="shift-base" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.base??''}" placeholder="例：80000" required></div><div class="field"><label for="shift-travel">交通費</label><input type="number" id="shift-travel" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.travel??0}" required></div><div class="field full"><div class="preview"><span>交通費込みの額面（自動計算）</span><strong id="shift-total">${money((x?.base||0)+(x?.travel||0))}</strong></div></div><div class="field full"><label for="shift-memo">メモ（任意）</label><textarea id="shift-memo" class="control" maxlength="1000">${esc(x?.memo||'')}</textarea></div><div class="field full"><label class="check-line"><input type="checkbox" id="also-template"> この条件を「よく使うバイト」にも保存</label><span class="help">次回から日付を選ぶだけで登録できます。</span></div></div><div class="modal-bottom">${id?`<button type="button" class="button danger" data-action="delete-shift" data-id="${esc(id)}" style="margin-right:auto">削除</button><button type="button" class="button" data-action="bulk-from-shift" data-id="${esc(id)}">別日にコピー</button>`:''}<button type="button" class="button" data-action="close-modal">キャンセル</button><button type="submit" class="button primary">${id?'更新する':'登録する'}</button></div></form>`;modalTemplate(id?'勤務を編集':'勤務を登録',body)}

function sameShift(a,b,date){return a.date===date&&a.employerId===b.employerId&&a.workTypeId===b.workTypeId&&a.base===b.base&&a.travel===b.travel}
function copyRecord(source,date){return {id:uid(),date,employerId:source.employerId,workTypeId:source.workTypeId||'',base:source.base,travel:source.travel,memo:source.memo||''}}
function addTemplate(source){const initial=employerName(source.employerId)+'・'+workTypeName(source.workTypeId);const name=prompt('定型バイトの名前を入力してください',initial);if(name===null)return;const val=name.trim();if(!val||val.length>100){alert('名前は1～100文字で入力してください');return}data.templates.push({id:uid(),name:val,employerId:source.employerId,workTypeId:source.workTypeId||'',base:source.base,travel:source.travel,memo:source.memo||''});if(save())toast('定型バイトを保存しました')}
function quickTemplateModal(){const inner=data.templates.length?data.templates.map(t=>`<div class="template-card"><div style="flex:1;min-width:0"><strong>${esc(t.name)}</strong><small style="display:block">${esc(employerName(t.employerId))}・${esc(workTypeName(t.workTypeId))}</small><b>${money(t.base+t.travel)}</b></div><div class="template-buttons"><button class="button sm primary" data-action="template-use" data-id="${esc(t.id)}">1日登録</button><button class="button sm" data-action="template-bulk" data-id="${esc(t.id)}">複数日登録</button></div></div>`).join(''):empty('テンプレートはまだありません','登録済み勤務の「定型登録」を使って作成してください。');modalTemplate('よく使うバイト',`<div class="info-box"><strong>金額は自動入力</strong>定型バイトを選んで日付だけ指定してください。複数日まとめて登録もできます。</div><div style="margin-top:14px">${inner}</div><div class="modal-bottom"><button class="button" data-action="close-modal">閉じる</button></div>`)}
let bulkDraft=null;
function bulkPicker(source,label){if(!source)return;bulkDraft={source,dates:new Set(),month:state.month,label};renderBulkPicker()}
function renderBulkPicker(){const b=bulkDraft;if(!b)return;const [y,m]=b.month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate();let cells='';for(let n=0;n<first;n++)cells+='<span class="bulk-blank"></span>';for(let d=1;d<=last;d++){const date=b.month+'-'+String(d).padStart(2,'0'),chosen=b.dates.has(date);cells+=`<button type="button" class="bulk-day ${chosen?'selected':''}" data-action="bulk-toggle" data-date="${date}" aria-pressed="${chosen}">${d}${chosen?' ✓':''}</button>`}const selected=[...b.dates].sort();modalTemplate('複数日にまとめて登録',`<div class="info-box"><strong>${esc(b.label)}</strong>${esc(employerName(b.source.employerId))}・${esc(workTypeName(b.source.workTypeId))} ／ ${money(b.source.base+b.source.travel)}<div style="margin-top:4px">コピー先の日付を複数タップしてください。すでに同じ勤務がある日付は重複登録しません。</div></div><div class="bulk-top"><button class="button sm" data-action="bulk-prev">‹ 前月</button><strong>${monthTitle(b.month)}</strong><button class="button sm" data-action="bulk-next">翌月 ›</button></div><div class="bulk-week">${['日','月','火','水','木','金','土'].map(x=>`<b>${x}</b>`).join('')}</div><div class="bulk-grid">${cells}</div><p class="detail-note">選択した日付：${selected.length?selected.map(x=>x.replaceAll('-','/')).join('、'):'まだ選択されていません'}</p><div class="modal-bottom"><button class="button" data-action="close-modal">キャンセル</button><button class="button primary" data-action="bulk-save" ${!selected.length?'disabled':''}>${selected.length}日分を登録</button></div>`)}
function bulkSave(){if(!bulkDraft||!bulkDraft.dates.size)return;let inserted=0,skipped=0;for(const date of bulkDraft.dates){if(data.shifts.some(x=>sameShift(x,bulkDraft.source,date))){skipped++;continue}data.shifts.push(copyRecord(bulkDraft.source,date));inserted++}bulkDraft=null;if(save()){closeModal();toast(`${inserted}件を追加しました${skipped?'（重複'+skipped+'件を除外）':''}`)}}

function paymentModal(id){
 const x=id?data.settlements.find(x=>x.id===id):null;if(id&&!x)return;
 if(!data.employers.length)return alert('最初に勤務先を登録してください。');
 const employerId=x?.employerId==='all'?(data.employers[0]?.id||''):x?.employerId||data.employers[0].id;
 const body=`<form id="payment-form" data-id="${esc(x?.id||'')}"><div class="form-grid">
 <div class="field full"><label for="pay-employer">勤務先 *</label><select id="pay-employer" class="control" required>${employerOptions(employerId,false)}</select></div>
 <div class="field full"><label for="pay-period">対象の締め期間 *</label><select id="pay-period" class="control" required></select><span class="help">勤務先の締め日から自動で期間を作成します。必要なら「設定」で締め日を変更してください。</span></div>
 <div class="field full"><div id="payment-target-total" class="selected-note"></div></div>
 <div class="field"><label for="pay-date">実際の振込日 *</label><input type="date" id="pay-date" class="control" value="${esc(x?.depositDate||TODAY)}" required></div>
 <div class="field"><label for="pay-tax">源泉徴収額 *</label><input type="number" id="pay-tax" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.tax??''}" required placeholder="例：8000"><span class="help">額面と手取りの差からは計算しません。源泉徴収票や給与明細を確認してください。</span></div>
 <div class="field full"><label for="pay-net">実際の手取り（振込金額） *</label><input type="number" id="pay-net" class="control" min="0" max="1000000000" step="1" inputmode="numeric" value="${x?.net??''}" required placeholder="例：77000"></div>
 <div class="field full"><label for="pay-memo">メモ（任意）</label><textarea id="pay-memo" class="control" maxlength="1000">${esc(x?.memo||'')}</textarea></div></div>
 <div class="modal-bottom">${x?`<button type="button" class="button danger" data-action="delete-payment" data-id="${esc(x.id)}" style="margin-right:auto">削除</button>`:''}<button type="button" class="button" data-action="close-modal">キャンセル</button><button type="submit" class="button primary">${x?'更新する':'登録する'}</button></div></form>`;
 modalTemplate(x?'給与振込を編集':'給与振込を登録',body);
 updatePeriodOptions(x?.periodEnd||null,x?.depositDate||null);
}
function updatePeriodOptions(preferred=null,keepDate=null){
 const id=document.getElementById('pay-employer')?.value,select=document.getElementById('pay-period');if(!select)return;
 const groups=periodGroups(id);
 if(preferred&&!groups.some(g=>g.end===preferred)){const p=data.settlements.find(x=>x.periodEnd===preferred&&x.employerId===id);if(p)groups.unshift({end:preferred,shifts:linkedShifts(p),payDate:expectedPayDate(preferred,id)})}
 select.innerHTML=groups.map(g=>`<option value="${g.end}">${periodLabel(g.end,id)} (${g.shifts.length}件・${money(g.shifts.reduce((n,s)=>n+s.base+s.travel,0))})</option>`).join('')||'<option value="">この勤務先の勤務記録がありません</option>';
 const selected=groups.find(g=>g.end===preferred)?.end||groups[0]?.end||'';
 if(selected)select.value=selected;
 updatePaymentTarget(keepDate);
}
function updatePaymentTarget(keepDate=null){
 const employerId=document.getElementById('pay-employer')?.value,end=document.getElementById('pay-period')?.value,out=document.getElementById('payment-target-total');if(!out)return;
 const group=periodGroups(employerId).find(g=>g.end===end);
 const old=data.settlements.find(p=>p.employerId===employerId&&p.periodEnd===end);
 const shifts=group?.shifts|| (old?linkedShifts(old):[]);
 out.textContent=shifts.length?`対象勤務 ${shifts.length}件 ／ 額面（交通費込み） ${money(shifts.reduce((a,x)=>a+x.base+x.travel,0))} ／ 支払予定日 ${expectedPayDate(end,employerId)}`:'対象の勤務がありません。先に勤務を登録してください。';
 const date=document.getElementById('pay-date');if(date){if(keepDate)date.value=keepDate;else if(end)date.value=expectedPayDate(end,employerId)}
}
function scheduleModal(id){const e=data.employers.find(x=>x.id===id);if(!e)return;
 const optionDays=(selected)=>`<option value="last" ${selected==='last'?'selected':''}>末日</option>`+Array.from({length:30},(_,i)=>i+1).map(n=>`<option value="${n}" ${selected===n?'selected':''}>${n}日</option>`).join('');
 modalTemplate('締め日・支払日の設定',`<form id="schedule-form" data-id="${esc(id)}"><h3>${esc(e.name)}</h3><div class="form-grid" style="margin-top:15px">
 <div class="field"><label for="schedule-close">締め日</label><select class="control" id="schedule-close">${optionDays(e.closingDay)}</select></div>

 <div class="field"><label for="schedule-day">支払日</label><select class="control" id="schedule-day">${optionDays(e.payDay)}</select></div></div>
 <div class="info-box warning" style="margin-top:14px">既存の振込記録は保存時点の勤務との紐づけを保持します。締め日を後から変えた場合、登録済みの振込を確認してください。休日による前倒し・後ろ倒しは自動計算しません。</div>
 <div class="modal-bottom"><button type="button" class="button" data-action="close-modal">キャンセル</button><button type="submit" class="button primary">保存</button></div></form>`)
}
function dayModal(date){const ss=data.shifts.filter(x=>x.date===date);const dateStr=date.replaceAll('-','/');modalTemplate(dateStr+' の勤務',`<div class="card-heading"><h3>この日の勤務：${ss.length}件</h3><button class="button primary sm" data-action="add-shift-on" data-date="${date}">＋ この日に登録</button></div>${ss.length?ss.map(shiftLine).join(''):empty('この日の勤務はありません','勤務を登録するとカレンダーに金額が表示されます。')}<div class="modal-bottom"><button class="button" data-action="close-modal">閉じる</button></div>`)}
function toast(msg){const root=document.getElementById('toast-root');if(!root)return;root.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>{root.innerHTML=''},3000)}
function saveShift(form){
 const id=form.dataset.id,date=document.getElementById('shift-date').value,base=Number(document.getElementById('shift-base').value),travel=Number(document.getElementById('shift-travel').value);
 let employerId=document.getElementById('shift-employer').value,workTypeId=document.getElementById('shift-worktype').value;
 if(!validDate(date)||!Number.isInteger(base)||!Number.isInteger(travel)||base<0||travel<0||base>1e9||travel>1e9){alert('勤務日と金額を確認してください。');return}
 if(employerId==='__new__'){const name=document.getElementById('shift-new-employer').value.trim();if(!name||name.length>100){alert('勤務先の名前を入力してください。');return}const existing=data.employers.find(x=>x.name===name);if(existing)employerId=existing.id;else{employerId=uid();data.employers.push({id:employerId,name,closingDay:'last',payDay:'last',payMonthOffset:1})}}
 if(!data.employers.some(x=>x.id===employerId)){alert('勤務先を選んでください。');return}
 if(workTypeId==='__new__'){const name=document.getElementById('shift-new-worktype').value.trim();if(!name||name.length>100){alert('仕事の種類の名前を入力してください。');return}const existing=data.workTypes.find(x=>x.name===name);if(existing)workTypeId=existing.id;else{workTypeId=uid();data.workTypes.push({id:workTypeId,name})}}
 if(workTypeId&&!data.workTypes.some(x=>x.id===workTypeId)){alert('仕事の種類を選んでください。');return}
 const next={id:id||uid(),date,employerId,workTypeId,base,travel,memo:document.getElementById('shift-memo').value.trim()};
 const saveAsTemplate=document.getElementById('also-template')?.checked;
 if(id){const i=data.shifts.findIndex(x=>x.id===id);if(i<0)return;data.shifts[i]=next}else data.shifts.push(next);
 if(save()){closeModal();if(saveAsTemplate)addTemplate(next);toast(id?'勤務を更新しました':'勤務を登録しました')}
}
function savePayment(form){
 const id=form.dataset.id,employerId=document.getElementById('pay-employer').value,periodEnd=document.getElementById('pay-period').value,depositDate=document.getElementById('pay-date').value,tax=Number(document.getElementById('pay-tax').value),net=Number(document.getElementById('pay-net').value);
 if(!data.employers.some(x=>x.id===employerId)||!validDate(periodEnd)||!validDate(depositDate)||!Number.isInteger(tax)||!Number.isInteger(net)||tax<0||net<0||tax>1e9||net>1e9){alert('勤務先・締め期間・振込日・金額を確認してください。');return}
 const group=periodGroups(employerId).find(x=>x.end===periodEnd)||(()=>{const old=data.settlements.find(p=>p.id===id&&p.periodEnd===periodEnd&&p.employerId===employerId);return old?{end:periodEnd,shifts:linkedShifts(old)}:null})();
 if(!group||!group.shifts.length){alert('対象の勤務が見つかりません。勤務先の締め日設定と勤務日を確認してください。');return}
 if(data.settlements.some(x=>x.id!==id&&x.employerId===employerId&&x.periodEnd===periodEnd)&&!confirm('この勤務先・締め期間には別の振込記録があります。分割振込として追加しますか？'))return;
 const next={id:id||uid(),workMonth:periodEnd.slice(0,7),periodEnd,employerId,depositDate,shiftIds:group.shifts.map(x=>x.id),tax,net,memo:document.getElementById('pay-memo').value.trim()};
 if(id){const i=data.settlements.findIndex(x=>x.id===id);if(i<0)return;data.settlements[i]=next}else data.settlements.push(next);
 if(save()){closeModal();toast(id?'振込情報を更新しました':'振込情報を登録しました')}
}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s)&&isNaN(Number(s)))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csv(name,rows){downloadFile(name,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function exportShifts(){const rows=[['勤務日','勤務先','仕事の種類','額面（交通費込み）','額面（交通費抜き）','交通費','メモ'],...data.shifts.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,employerName(x.employerId),workTypeName(x.workTypeId),x.base+x.travel,x.base,x.travel,x.memo])];csv('doctorpay_勤務_'+TODAY+'.csv',rows);toast('勤務CSVを書き出しました')}
function exportPayments(){const rows=[['対象締め日','勤務先','振込日','源泉徴収額','手取り（振込金額）','紐づく勤務件数','メモ'],...data.settlements.slice().sort((a,b)=>a.depositDate.localeCompare(b.depositDate)).map(x=>[x.periodEnd,employerName(x.employerId),x.depositDate,x.tax,x.net,x.shiftIds?.length||0,x.memo])];csv('doctorpay_振込_'+TODAY+'.csv',rows);toast('振込CSVを書き出しました')}
function importJSON(file){if(!file)return;if(file.size>5e6){alert('ファイルが大きすぎます（最大5MB）。');return}file.text().then(txt=>{let parsed;try{parsed=normalize(JSON.parse(txt))}catch(e){alert('読み込みに失敗しました：'+e.message);return}const msg='このバックアップを読み込むと、現在のこの端末の記録はすべて置き換わります。\n\n勤務 '+parsed.shifts.length+'件／振込 '+parsed.settlements.length+'件／仕事の種類 '+parsed.workTypes.length+'件／税金設定 '+Object.keys(parsed.taxProfiles).length+'年分\n\n現在の記録を保存してから操作することをおすすめします。続けますか？';if(!confirm(msg))return;data=parsed;if(save())toast('バックアップを読み込みました')}).catch(()=>alert('ファイルを読み込めませんでした'))}
function navTo(tab){state.tab=tab;render();scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;switch(action){case'nav':navTo(btn.dataset.tab);break;case'prev-month':state.month=monthOffset(state.month,-1);render();break;case'next-month':state.month=monthOffset(state.month,1);render();break;case'prev-year':state.year--;render();break;case'next-year':state.year++;render();break;case'add-shift':shiftModal();break;case'quick-template':shiftModal();break;case'template-use':{const t=data.templates.find(x=>x.id===id);if(t)shiftModal(null,TODAY,t);break}case'template-bulk':{const t=data.templates.find(x=>x.id===id);if(t)bulkPicker(t,t.name);break}case'bulk-from-shift':{const t=data.shifts.find(x=>x.id===id);if(t)bulkPicker(t,'登録済み勤務 '+t.date);break}case'bulk-prev':if(bulkDraft){bulkDraft.month=monthOffset(bulkDraft.month,-1);renderBulkPicker()}break;case'bulk-next':if(bulkDraft){bulkDraft.month=monthOffset(bulkDraft.month,1);renderBulkPicker()}break;case'bulk-toggle':if(bulkDraft&&validDate(btn.dataset.date)){const d=btn.dataset.date;bulkDraft.dates.has(d)?bulkDraft.dates.delete(d):bulkDraft.dates.add(d);renderBulkPicker()}break;case'bulk-save':bulkSave();break;case'template-from-shift':{const x=data.shifts.find(x=>x.id===id);if(x)addTemplate(x);break}case'template-delete':{const t=data.templates.find(x=>x.id===id);if(t&&confirm('テンプレート「'+t.name+'」を削除しますか？')){data.templates=data.templates.filter(x=>x.id!==id);if(save())toast('テンプレートを削除しました')}break}case'add-shift-on':shiftModal(null,btn.dataset.date);break;case'edit-shift':shiftModal(id);break;case'open-day':dayModal(btn.dataset.date);break;case'add-payment':paymentModal();break;case'schedule-employer':scheduleModal(id);break;case'edit-payment':paymentModal(id);break;case'close-modal':closeModal();break;case'delete-shift':if(confirm('この勤務記録を削除しますか？')){data.shifts=data.shifts.filter(x=>x.id!==id);if(save()){closeModal();toast('勤務を削除しました')}}break;case'delete-payment':if(confirm('この振込記録を削除しますか？')){data.settlements=data.settlements.filter(x=>x.id!==id);if(save()){closeModal();toast('振込情報を削除しました')}}break;case'rename-employer':{const emp=data.employers.find(x=>x.id===id);if(!emp)return;const name=prompt('勤務先の新しい名前を入力してください',emp.name);if(name===null)return;const val=name.trim();if(!val||val.length>100)return alert('1～100文字で入力してください');if(data.employers.some(x=>x.name===val&&x.id!==id))return alert('同じ名前の勤務先が存在します');emp.name=val;if(save())toast('勤務先の名前を変更しました');break}case'delete-employer':{const emp=data.employers.find(x=>x.id===id);if(!emp)return;if(data.shifts.some(x=>x.employerId===id)||data.settlements.some(x=>x.employerId===id)||data.templates.some(x=>x.employerId===id))return alert('この勤務先には勤務・振込記録があるため削除できません。名称変更は可能です。');if(confirm('「'+emp.name+'」を候補から削除しますか？')){data.employers=data.employers.filter(x=>x.id!==id);if(save())toast('勤務先を削除しました')}break}case'export-json':downloadFile('doctorpay_backup_'+TODAY+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('バックアップを保存しました');break;case'import-json':document.getElementById('import-file')?.click();break;case'export-shifts':exportShifts();break;case'export-payments':exportPayments();break;case'rename-worktype':{const obj=data.workTypes.find(x=>x.id===id);if(!obj)return;const name=prompt('仕事の種類の新しい名前を入力してください',obj.name);if(name===null)return;const val=name.trim();if(!val||val.length>100)return alert('1～100文字で入力してください');if(data.workTypes.some(x=>x.name===val&&x.id!==id))return alert('同じ種類が登録済みです');obj.name=val;if(save())toast('仕事の種類を変更しました');break}case'delete-worktype':{const obj=data.workTypes.find(x=>x.id===id);if(!obj)return;if(data.shifts.some(x=>x.workTypeId===id)||data.templates.some(x=>x.workTypeId===id))return alert('使用中の仕事の種類は削除できません。名前変更を利用してください。');if(confirm('「'+obj.name+'」を削除しますか？')){data.workTypes=data.workTypes.filter(x=>x.id!==id);if(save())toast('仕事の種類を削除しました')}break}case'delete-all':{if(!confirm('全勤務・全振込・勤務先をすべて削除します。元に戻せません。バックアップは保存しましたか？'))return;if(!confirm('最終確認：すべての記録を削除しますか？'))return;data=normalize({version:1,employers:[],shifts:[],settlements:[],updatedAt:null});if(save())toast('すべての記録を削除しました');break}}});

document.addEventListener('submit',e=>{
 if(e.target.id==='shift-form'){e.preventDefault();saveShift(e.target)}
 else if(e.target.id==='payment-form'){e.preventDefault();savePayment(e.target)}
 else if(e.target.id==='employer-form'){e.preventDefault();const name=document.getElementById('new-employer').value.trim();if(!name)return;if(data.employers.some(x=>x.name===name))return alert('この名前は登録済みです');data.employers.push({id:uid(),name,closingDay:'last',payDay:'last',payMonthOffset:1});if(save())toast('勤務先を追加しました')}
 else if(e.target.id==='schedule-form'){e.preventDefault();const emp=data.employers.find(x=>x.id===e.target.dataset.id);if(!emp)return;emp.closingDay=payDayNum(document.getElementById('schedule-close').value);emp.payDay=payDayNum(document.getElementById('schedule-day').value);emp.payMonthOffset=Number(document.getElementById('schedule-offset').value);if(save()){closeModal();toast('給与スケジュールを更新しました')}}
 else if(e.target.id==='worktype-form'){e.preventDefault();const name=document.getElementById('new-worktype').value.trim();if(!name)return;if(data.workTypes.some(x=>x.name===name))return alert('この名前は登録済みです');data.workTypes.push({id:uid(),name});if(save())toast('仕事の種類を追加しました')}
 else if(e.target.id==='tax-form'){e.preventDefault();const p={};for(const k of TAX_FIELDS){const raw=document.getElementById('tax-'+k).value.trim(),n=raw===''?0:Number(raw);if(!Number.isSafeInteger(n)||n<0||n>1e9){alert('金額を確認してください：'+k);return}p[k]=n}for(const k of ['salaryOverride']){const raw=document.getElementById('tax-'+k).value.trim(),n=raw===''?null:Number(raw);if(n!==null&&(!Number.isSafeInteger(n)||n<0||n>1e9)){alert('年間補正額を確認してください：'+k);return}p[k]=n}data.taxProfiles[String(state.year)]=p;if(save())toast('年収見込みと控除を保存しました')}
});

document.addEventListener('change',e=>{if(e.target.id==='month-picker'){if(validMonth(e.target.value)){state.month=e.target.value;render()}}else if(e.target.id==='shift-employer'){const n=document.getElementById('new-employer-wrap');if(n)n.classList.toggle('hidden',e.target.value!=='__new__')}else if(e.target.id==='shift-template'&&e.target.value){const t=data.templates.find(x=>x.id===e.target.value);const chosen=document.getElementById('shift-date')?.value;if(t)shiftModal(null,chosen,t)}else if(e.target.id==='shift-worktype'){const n=document.getElementById('new-worktype-wrap');if(n)n.classList.toggle('hidden',e.target.value!=='__new__')}else if(e.target.id==='pay-employer'){updatePeriodOptions()}else if(e.target.id==='pay-period'){updatePaymentTarget()}else if(e.target.id==='import-file'){importJSON(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='shift-base'||e.target.id==='shift-travel'){const base=Number(document.getElementById('shift-base')?.value||0),travel=Number(document.getElementById('shift-travel')?.value||0),o=document.getElementById('shift-total');if(o)o.textContent=money(base+travel)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-wrap'))closeModal()});
document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.id==='modal-wrap')closeModal()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
// 給与データは公開APIなどに公開せず、端末内にのみ保存します。
})();
</script>
